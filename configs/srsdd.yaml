dataset:
  name: SRSDD-v1.0
  root: /path/to/SRSDD-v1.0
  train: train/images
  val: val/images
  test: test/images
  num_classes: 6

model:
  candidate_ann_ratios: [0.25, 0.50, 0.75]
  default_time_steps: 3
  use_scene_router: true
  use_scattering_evidence: true
  use_subthreshold_recovery: true

training:
  epochs: 100
  batch_size: 32
  image_size: 800
  seed: 0
  optimizer: adamw
  amp: true
  pretrained: false

