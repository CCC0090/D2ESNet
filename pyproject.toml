[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d2esnet"
version = "0.1.0"
description = "Reference implementation of D2ES-Net for SAR ship detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
profile = [
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["d2esnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

